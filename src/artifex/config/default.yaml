agent:
  autonomous: true
  poll_interval_seconds: 10

planner:
  candidate_count: 8
  mix:
    evergreen: 0.40
    trend: 0.30
    seasonal: 0.20
    exploration: 0.10
  score_weights:
    trend: 0.15
    evergreen: 0.10
    character_fit: 0.15
    novelty: 0.15
    visual_strength: 0.15
    historical_performance: 0.10
    seasonality: 0.10
    series_potential: 0.05
    readiness: 0.05
  similarity_penalty_weight: 0.35
  recent_character_penalty_weight: 0.15
  hard_similarity_threshold: 0.90

production:
  retry_limit: 3
  infrastructure_retry_limit: 5
  idea_inventory_target: 30
  planned_inventory_target: 10
  completed_inventory_target: 7
  idea_replenish_batch: 3
  model_family: ilxl
  checkpoint: null
  width: 1024
  height: 1536
  batch_size: 1

llm:
  backend: llama_cpp
  base_url: http://127.0.0.1:8080
  model: spark-x2.5-4b-heretic-jp
  structured_output: json_schema
  temperature: 0.9
  timeout_seconds: 180
  request_attempts: 2
  retry_backoff_seconds: 1
  structured_repair_attempts: 2
  api_key_env: null

characters:
  profile_dirs:
    - profiles/characters
  minimum_readiness: 0.0

loras:
  roots:
    - models/loras
  extensions:
    - .safetensors
  metadata_header_max_mib: 16
  production_identity_threshold: 0.80
  production_quality_threshold: 0.70
  production_flexibility_threshold: 0.50
  maximum_character_loras_per_scene: 4

comfyui:
  base_url: http://127.0.0.1:8188
  output_dir: null
  timeout_seconds: 30
  execution_timeout_seconds: 900
  poll_interval_seconds: 1
  request_attempts: 3
  reconnect_backoff_seconds: 1
  default_template: ilxl_base_v1

evaluation:
  provider: openai_compatible_vision
  vision_base_url: null
  vision_model: null
  vision_api_key_env: null
  vision_timeout_seconds: 120
  vision_request_attempts: 2
  vision_retry_backoff_seconds: 1
  weights:
    identity: 0.25
    alignment: 0.15
    face_quality: 0.15
    technical_quality: 0.15
    aesthetic: 0.10
    novelty: 0.08
    continuity: 0.07
    integrity: 0.05
  identity_hard_min: 0.60
  integrity_hard_min: 0.80
  similarity_hard_max: 0.92
  accepted_score_min: 0.75
  review_score_min: 0.55
  identity_accept_min: 0.75
  alignment_review_min: 0.60
  face_review_min: 0.60
  technical_review_min: 0.60
  continuity_review_min: 0.55

trends:
  enabled: true
  default_ttl_hours: 24
  freshness_half_life_hours: 8
  max_summary_signals: 20
  minimum_effective_strength: 0.05

discord:
  enabled: false
  token_env: ARTIFEX_DISCORD_TOKEN
  guild_id: null
  channel_id: null
  allowed_user_ids: []
  allowed_role_ids: []
  command_prefix: "!artifex "
  notify_completion: true
  notify_review: true
  notify_error: true
  notify_backend: true
  notify_disk: true
  daily_summary_hour_local: 9
  daily_summary_timezone: Asia/Tokyo

rights:
  enforce: true
  default_profile: unconfigured
  profile_dirs:
    - profiles/policies

storage:
  database_url: sqlite:///data/artifex.sqlite3
  packs_dir: data/packs
  minimum_free_gib: 5

operations:
  health_interval_seconds: 30
  backend_failure_threshold: 3
  heartbeat_interval_seconds: 30
  heartbeat_stale_seconds: 120
  sustained_run_cycles: 5
  max_scenes_per_pack: 12
  max_attempts_per_scene: 4
  max_events_per_cycle: 50
  event_retention_rows: 10000
