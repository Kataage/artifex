agent:
  autonomous: true
  poll_interval_seconds: 10

planner:
  candidate_count: 8
  mix:
    evergreen: 0.40
    trend: 0.30
    seasonal: 0.20
    exploration: 0.10
  score_weights:
    trend: 0.15
    evergreen: 0.10
    character_fit: 0.15
    novelty: 0.15
    visual_strength: 0.15
    historical_performance: 0.10
    seasonality: 0.10
    series_potential: 0.05
    readiness: 0.05
  similarity_penalty_weight: 0.35
  recent_character_penalty_weight: 0.15
  hard_similarity_threshold: 0.90

production:
  retry_limit: 3
  idea_inventory_target: 30
  planned_inventory_target: 10
  completed_inventory_target: 7

llm:
  backend: llama_cpp
  base_url: http://127.0.0.1:8080
  model: spark-x2.5-4b-heretic-jp
  structured_output: json_schema
  temperature: 0.9
  timeout_seconds: 180
  request_attempts: 2
  retry_backoff_seconds: 1
  structured_repair_attempts: 2
  api_key_env: null

characters:
  profile_dirs:
    - profiles/characters
  minimum_readiness: 0.0

loras:
  roots:
    - models/loras
  extensions:
    - .safetensors
  metadata_header_max_mib: 16
  production_identity_threshold: 0.80
  production_quality_threshold: 0.70
  production_flexibility_threshold: 0.50
  maximum_character_loras_per_scene: 4

comfyui:
  base_url: http://127.0.0.1:8188
  timeout_seconds: 30
  execution_timeout_seconds: 900
  poll_interval_seconds: 1
  request_attempts: 3
  reconnect_backoff_seconds: 1
  default_template: ilxl_base_v1

discord:
  enabled: false
  token_env: ARTIFEX_DISCORD_TOKEN
  notify_completion: true
  notify_review: true
  notify_error: true

rights:
  enforce: true

storage:
  database_url: sqlite:///data/artifex.sqlite3
  packs_dir: data/packs
  minimum_free_gib: 5
