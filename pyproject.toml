[project]
name = "artifex"
version = "0.1.0"
description = "Autonomous Illustration Production System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "httpx>=0.28.0",
    "pillow>=11.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.40",
    "typer>=0.16.0",
]

[project.optional-dependencies]
discord = [
    "discord.py>=2.6.0",
]
dev = [
    "discord.py>=2.6.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.0",
    "types-PyYAML>=6.0.12",
    "mypy>=1.17.0",
]

[project.scripts]
artifex = "artifex.cli:app"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artifex"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["alembic", "alembic.*"]
ignore_missing_imports = true
