name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest

  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run python -c "import artifex; print('Artifex import OK')"
      - run: uv run artifex --help
      - run: uv run artifex startup --help
      - run: uv run artifex render-node socket-audit --help
      - run: uv run pytest -q tests/test_windows_task_safety.py
      - run: uv run pytest -q tests/test_windows_task_native_integration.py
      - run: uv run pytest -q tests/test_windows_venv_renderer_identity.py
      - run: uv run pytest -q tests/test_renderer_owner_audit.py
      - run: uv run pytest -q tests/test_qualification_renderer_owner_evidence.py
      - run: uv run pytest -q tests/test_soak_owner_continuity.py
      - run: uv run pytest -q tests/test_qualification_readiness_diagnostics.py
      - run: uv run pytest -q tests/test_qualification_readiness_action_plan.py
      - run: uv run pytest -q tests/test_qualification_readiness_recheck.py
      - run: uv run artifex qualify recheck --help
      - run: uv run artifex qualify plan --help
      - run: uv run artifex qualify readiness --help
      - run: uv run artifex qualify owner-observe --help
      - run: uv run artifex render-node owner-audit --help
      - run: uv run pytest -q tests/test_windows_task_lifecycle_probe.py
      - run: uv run artifex startup lifecycle-probe --json
      # These operate ONLY on uniquely named temporary mock tasks in this CI runner.
      # Record observations, not production child-survival qualification.
      - run: uv run artifex startup lifecycle-probe --apply --mode baseline --report-dir data/qualification/scheduler-probe --json
        timeout-minutes: 3
      - run: uv run artifex startup lifecycle-probe --apply --mode protected --report-dir data/qualification/scheduler-probe --json
        timeout-minutes: 3
      - run: uv run artifex startup audit --help
      - run: uv run pytest -q tests/test_supervisor_lease.py
      - run: uv run pytest -q tests/test_renderer_socket_audit.py tests/test_comfy_reattachment.py
      - run: uv run artifex render-node serve --help
      - run: uv run pytest -q tests/test_renderer_gateway.py tests/test_submission_fence.py tests/test_comfy_client.py
      - run: uv run artifex maintenance pair --help
      - run: uv run pytest -q tests/test_pair_maintenance.py
      - run: uv run artifex maintenance fence --help
      - run: uv run artifex maintenance drain --help
      - run: uv run artifex deployment activate --help
      - run: uv run artifex deployment verify --help
      - run: uv run artifex deployment pair-export --help
      - run: uv run artifex deployment pair-check --help
      - run: uv run artifex deployment pair-smoke --help
      - run: uv run artifex qualify collect --help
      - run: uv run artifex qualify archive-reproduce --help
      - run: uv run artifex qualify soak-run --help
      - run: uv run artifex qualify soak-observe --help
      - run: uv run artifex qualify soak-check --help
      - run: uv run artifex onboard inspect --help
      - run: uv run artifex onboard renderer --help
      - run: uv run artifex onboard inspect --role controller --json
      - run: uv run artifex onboard dependencies --help
      - run: uv run artifex onboard llama-assets --help
      - run: uv run artifex onboard llama-install --help
      - run: uv run artifex onboard comfy-install --help
      - run: uv run artifex onboard workflow-audit --help
      - run: uv run artifex onboard deps-resolve --help
      - run: uv run artifex onboard deps-install --help
      - run: uv run artifex onboard deps-draft --help
      - run: uv run artifex onboard reconcile-renderer --help
      - run: uv run artifex onboard prepare-renderer --help
      - run: uv run artifex onboard models-draft --help
      - run: uv run artifex onboard model-sources-list --help
      - run: uv run artifex onboard model-sources-add --help
      - run: uv run artifex onboard model-sources-remove --help
      - run: uv run artifex startup status --role controller --json
      - run: uv run artifex research status --json

      - name: Archive isolated Task Scheduler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-scheduler-lifecycle
          path: data/qualification/scheduler-probe/**/report.json
          if-no-files-found: warn
          retention-days: 7
