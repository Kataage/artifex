name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Diagnose Ruff autofix
        run: |
          uv run ruff check src/artifex/characters/catalog.py --fix
          git diff -- src/artifex/characters/catalog.py
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest

  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run python -c "import artifex; print('Artifex import OK')"
      - run: uv run artifex --help
      - run: uv run artifex research status --json
